name: Build Android APK

# SlotBound 安卓单体 APK：游戏直接嵌进包里，装上就能玩。
# 手动触发，只出 release APK（SlotBound.apk）当 workflow artifact，不发 Release。
# 签名用固定密钥（GitHub Secrets ANDROID_KEYSTORE_*，2026-11-25 建），
# 以后所有构建同一签名，可直接覆盖安装（第二次构建的 debug 签名已无法找回，
# 那次的私钥随临时构建机销毁了，换固定密钥后须先卸载一次）。
# 游戏内容来自 Yakult00/Slotbound-iOS（CI 里 checkout 打包），安卓版本号单独从 1.0.0 起。
# 注意：游戏自带的完整性检查只认 fused 的 game.love 文件，不认 APK 里散放的
# 文件，所以不能让 action 把 game.love 解开放进 assets，必须把整个 game.love
# 以 extra-assets 的形式原样放进 assets/game.love。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string (empty = latest tag of this repo, or 1.0.0)"
        required: false
        default: ""
      abis:
        description: "目标 ABI（arm64 = 只编 arm64-v8a，快；all = 全部）"
        type: choice
        default: "arm64"
        options:
          - arm64
          - all

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Slotbound-APK
        uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Checkout Slotbound-iOS (game files)
        uses: actions/checkout@v4
        with:
          repository: Yakult00/Slotbound-iOS
          path: ios
          fetch-depth: 0

      - name: Select ABI patch
        id: abi
        run: |
          set -euo pipefail
          if [ "${{ inputs.abis }}" = "all" ]; then
            echo "patch=" >> "$GITHUB_OUTPUT"
            echo "ABI: all (arm64-v8a + armeabi-v7a + x86_64 debug)"
          else
            echo "patch=./patches/arm64-only.patch" >> "$GITHUB_OUTPUT"
            echo "ABI: arm64-v8a only"
          fi

      - name: Derive version
        id: version
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            VER="${{ inputs.version }}"
          else
            # Android versioning is separate from iOS: latest vX.Y.Z tag of
            # this repo, or 1.0.0 when no tag exists yet.
            VER="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null | sed 's/^v//')" || true
            if [ -z "$VER" ]; then VER="1.0.0"; fi
          fi
          CODE="$(echo "$VER" | tr -d '.')"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version: $VER ($CODE)"

      - name: Verify game file integrity
        working-directory: ios
        run: python3 tools/verify_integrity.py .

      - name: Package game.love from repo files
        working-directory: ios
        run: |
          set -euo pipefail
          python3 - << 'PYEOF'
          import os, zipfile
          include = ["main.lua", "real_main.luac", "conf.lua", "icon.png",
                     "trainer_backend.lua", "release.flag", "@bootstrap", "src"]
          with zipfile.ZipFile("game.love", "w", zipfile.ZIP_DEFLATED) as z:
              for entry in include:
                  if os.path.isdir(entry):
                      for root, _, files in os.walk(entry):
                          for f in files:
                              p = os.path.join(root, f)
                              z.write(p, p)
                  else:
                      z.write(entry, entry)
          print("game.love packaged")
          PYEOF
          ls -lh game.love

      - name: Assert game.love contents
        working-directory: ios
        run: |
          set -euo pipefail
          python3 - << 'PYEOF'
          import sys, zipfile
          EXPECT_TOTAL = 2079
          EXPECT_SRC = 2072
          KEY_FILES = ["main.lua", "real_main.luac", "conf.lua", "icon.png",
                       "trainer_backend.lua", "release.flag", "@bootstrap"]
          with zipfile.ZipFile("game.love") as z:
              names = z.namelist()
          total = len(names)
          src_count = sum(1 for n in names if n.startswith("src/"))
          missing = [k for k in KEY_FILES if k not in names]
          problems = []
          if total != EXPECT_TOTAL:
              problems.append(f"total entries: want {EXPECT_TOTAL}, got {total}")
          if src_count != EXPECT_SRC:
              problems.append(f"src/ entries: want {EXPECT_SRC}, got {src_count}")
          if missing:
              problems.append(f"missing key files: {', '.join(missing)}")
          if problems:
              print("FAIL: game.love contents assertion failed:")
              for p in problems:
                  print("  " + p)
              sys.exit(1)
          print(f"OK: game.love has {total} entries ({src_count} under src/), "
                f"all {len(KEY_FILES)} key files present")
          PYEOF

      - name: Create dummy love package
        run: |
          set -euo pipefail
          python3 - << 'PYEOF'
          # love-actions-android always EXTRACTS love-package loose into assets/.
          # The game's own bootstrap rejects loose APK assets (it wants a real
          # fused .love, like iOS). So feed the action a dummy .love and put
          # the real game.love in via extra-assets: LÖVE then finds
          # assets/game.love and loads it as a fused archive.
          import zipfile
          with zipfile.ZipFile("dummy.love", "w", zipfile.ZIP_DEFLATED) as z:
              z.writestr("main.lua", 'function love.draw() love.graphics.print("dummy", 10, 10) end\n')
              z.writestr("conf.lua", 'function love.conf(t) t.window.title = "SlotBound" end\n')
          print("dummy.love created")
          PYEOF
          ls -lh dummy.love

      - name: Build Android APK
        uses: love-actions/love-actions-android@v2
        with:
          app-name: "SlotBound"
          bundle-id: "com.yakult00.slotbound"
          resource-path: "./android/res"
          icon-specifier: "@drawable/icon"
          love-ref: "11.5a"
          love-patch: ${{ steps.abi.outputs.patch }}
          love-package: "./dummy.love"
          extra-assets: "./ios/game.love"
          product-name: "SlotBound"
          version-string: "${{ steps.version.outputs.version }}"
          version-code: ${{ steps.version.outputs.code }}
          output-folder: "./dist"
          keystore-alias: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-key-password: ${{ secrets.ANDROID_KEYSTORE_KEYPASSWORD }}
          keystore-store-password: ${{ secrets.ANDROID_KEYSTORE_STOREPASSWORD }}

      - name: Rename to SlotBound.apk
        run: |
          set -euo pipefail
          mv dist/SlotBound-release.apk dist/SlotBound.apk
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SlotBound.apk
          path: dist/SlotBound.apk
