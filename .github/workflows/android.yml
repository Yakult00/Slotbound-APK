name: Build Android APK

# SlotBound 安卓单体 APK：游戏直接嵌进包里，装上就能玩。
# 手动触发，只出 release APK（SlotBound.apk）当 workflow artifact，不发 Release。
# 签名用固定密钥（GitHub Secrets ANDROID_KEYSTORE_*）。
# 游戏本体 game.love 存放在本仓库的 release 资产里（tag: game-latest），
# 构建时用 gh 拉取并校验 tools/game_love.sha256，与 Slotbound-iOS 仓库完全解耦。
# 更新游戏本体：gh release upload game-latest game.love --clobber -R Yakult00/Slotbound-APK
# 然后同步改 tools/game_love.sha256。
# 注意：游戏自带的完整性检查只认 fused 的 game.love，不认 APK 里散放的文件，
# 所以必须把整个 game.love 原样放进 assets/game.love。
#
# 性能：不再用 love-actions/love-actions-android —— 它每次都先编一个从不使用的
# debug 变体（约占一半时间）。这里只跑 assembleEmbedRecordRelease。
# 默认只编 arm64-v8a（patches/arm64-only.patch），需要全 ABI 时把 abis 选成 all。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string (empty = latest tag of this repo, or 1.0.0)"
        required: false
        default: ""
      abis:
        description: "目标 ABI（arm64 = 只编 arm64-v8a，快；all = 全部）"
        type: choice
        default: "arm64"
        options:
          - arm64
          - all

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Slotbound-APK
        uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Fetch game.love payload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 游戏本体存在本仓库的 release 资产里（tag: game-latest），
          # 构建不再 clone Slotbound-iOS，两个仓库互不影响。
          gh release download game-latest -R "${{ github.repository }}" \
            -p game.love --clobber -O game.love
          sha256sum -c tools/game_love.sha256
          ls -lh game.love

      - name: Derive version
        id: version
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            VER="${{ inputs.version }}"
          else
            # Android versioning is separate from iOS: latest vX.Y.Z tag of
            # this repo, or 1.0.0 when no tag exists yet.
            VER="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null | sed 's/^v//')" || true
            if [ -z "$VER" ]; then VER="1.0.0"; fi
          fi
          # versionCode 必须单调递增：major*10000 + minor*100 + patch
          CODE="$(printf '%s' "$VER" | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version: $VER (code $CODE)"

      - name: Create dummy love package
        run: |
          set -euo pipefail
          python3 - << 'PYEOF'
          # LÖVE 只认 assets 里的 fused game.love；先放一个空包占位，
          # 再把真正的 game.love 拷进 assets。
          import zipfile
          with zipfile.ZipFile("dummy.love", "w", zipfile.ZIP_DEFLATED) as z:
              z.writestr("main.lua", 'function love.draw() love.graphics.print("dummy", 10, 10) end\n')
              z.writestr("conf.lua", 'function love.conf(t) t.window.title = "SlotBound" end\n')
          print("dummy.love created")
          PYEOF

      - name: Get Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Checkout love-android
        uses: actions/checkout@v4
        with:
          repository: love2d/love-android
          ref: "11.5a"
          submodules: recursive
          path: love-android

      - name: Apply ABI patch
        if: inputs.abis != 'all'
        run: |
          set -euo pipefail
          cd love-android
          git apply ../patches/arm64-only.patch
          grep -n "abiFilters" love/build.gradle

      - name: Copy resources and assets
        run: |
          set -euo pipefail
          cp -r -f ./android/res/* love-android/app/src/main/res/
          7z x dummy.love -olove-android/app/src/embed/assets/ > /dev/null
          cp -f ./game.love love-android/app/src/embed/assets/game.love
          ls -lh love-android/app/src/embed/assets/

      - name: Decode keystore
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "FAIL: ANDROID_KEYSTORE_BASE64 为空"
            exit 1
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > love-android/app/android.keystore
          ls -l love-android/app/android.keystore

      - name: Patch android project
        env:
          VERSION_STRING: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEYSTORE_KEYPASSWORD }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_STOREPASSWORD }}
        run: python3 tools/patch_android_project.py love-android

      - name: Cache gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-11.5a-${{ hashFiles('patches/arm64-only.patch') }}
          restore-keys: gradle-${{ runner.os }}-11.5a-

      - name: Cache NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/25.2.9519653
          key: ndk-25.2.9519653

      - name: Build release APK
        run: |
          set -euo pipefail
          cd love-android
          chmod +x gradlew
          ./gradlew --no-daemon --build-cache assembleEmbedRecordRelease

      - name: Verify release APK and signature
        run: |
          set -euo pipefail
          APK=love-android/app/build/outputs/apk/embedRecord/release/app-embed-record-release.apk
          test -f "$APK" || { echo "FAIL: 没找到 release APK: $APK"; exit 1; }
          SIGNER="$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          echo "apksigner: $SIGNER"
          "$SIGNER" verify --print-certs "$APK" | head -6
          if ! unzip -l "$APK" | grep -q "assets/game.love"; then
            echo "FAIL: APK 里没有 assets/game.love"
            exit 1
          fi
          ls -lh "$APK"

      - name: Copy APK to dist
        run: |
          set -euo pipefail
          mkdir -p dist
          cp love-android/app/build/outputs/apk/embedRecord/release/app-embed-record-release.apk dist/SlotBound.apk
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SlotBound.apk
          path: dist/SlotBound.apk
